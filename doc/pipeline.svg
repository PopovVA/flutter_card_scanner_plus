<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="24" fill="#0f172a"/>

  <!-- lanes -->
  <rect x="40" y="60" width="480" height="260" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="48" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1.5">NATIVE</text>
  <rect x="580" y="60" width="580" height="260" rx="18" fill="#1e1b4b" stroke="#3730a3"/>
  <text x="600" y="48" fill="#a5b4fc" font-size="13" font-weight="600" letter-spacing="1.5">DART</text>

  <!-- native boxes -->
  <g>
    <rect x="70" y="120" width="180" height="140" rx="14" fill="#0f172a" stroke="#475569"/>
    <text x="160" y="160" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Camera</text>
    <text x="160" y="186" fill="#94a3b8" font-size="13" text-anchor="middle">AVCaptureSession</text>
    <text x="160" y="206" fill="#94a3b8" font-size="13" text-anchor="middle">CameraX</text>
    <text x="160" y="238" fill="#4ade80" font-size="12" text-anchor="middle">→ Flutter texture</text>
  </g>
  <g>
    <rect x="300" y="120" width="190" height="140" rx="14" fill="#0f172a" stroke="#475569"/>
    <text x="395" y="160" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">OCR</text>
    <text x="395" y="186" fill="#94a3b8" font-size="13" text-anchor="middle">Vision (iOS)</text>
    <text x="395" y="206" fill="#94a3b8" font-size="13" text-anchor="middle">ML Kit (Android)</text>
    <text x="395" y="238" fill="#4ade80" font-size="12" text-anchor="middle">region of interest only</text>
  </g>
  <line x1="250" y1="190" x2="298" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="178" fill="#64748b" font-size="11" text-anchor="middle">frames</text>

  <!-- bridge -->
  <line x1="490" y1="190" x2="608" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="549" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">text lines</text>
  <text x="549" y="214" fill="#94a3b8" font-size="11" text-anchor="middle">+ boxes</text>

  <!-- dart boxes -->
  <g>
    <rect x="610" y="90" width="160" height="60" rx="12" fill="#0f172a" stroke="#6366f1"/>
    <text x="690" y="116" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">PanParser</text>
    <text x="690" y="136" fill="#94a3b8" font-size="12" text-anchor="middle">Luhn + BIN + OCR fixes</text>

    <rect x="610" y="160" width="160" height="60" rx="12" fill="#0f172a" stroke="#6366f1"/>
    <text x="690" y="186" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">ExpiryParser</text>
    <text x="690" y="206" fill="#94a3b8" font-size="12" text-anchor="middle">MM/YY, latest date wins</text>

    <rect x="610" y="230" width="160" height="60" rx="12" fill="#0f172a" stroke="#6366f1"/>
    <text x="690" y="256" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">NameParser</text>
    <text x="690" y="276" fill="#94a3b8" font-size="12" text-anchor="middle">stop words + layout</text>
  </g>

  <g>
    <rect x="820" y="120" width="150" height="140" rx="14" fill="#0f172a" stroke="#6366f1"/>
    <text x="895" y="160" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Frame</text>
    <text x="895" y="180" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Aggregator</text>
    <text x="895" y="208" fill="#94a3b8" font-size="12" text-anchor="middle">sliding window</text>
    <text x="895" y="226" fill="#94a3b8" font-size="12" text-anchor="middle">majority vote</text>
    <text x="895" y="244" fill="#94a3b8" font-size="12" text-anchor="middle">required / preferred</text>
  </g>
  <path d="M770 120h20v70h28" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M770 190h48" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M770 260h20v-70h28" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="1000" y="140" width="140" height="100" rx="14" fill="#14532d" stroke="#4ade80"/>
    <text x="1070" y="176" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">CardScan</text>
    <text x="1070" y="196" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Result</text>
    <text x="1070" y="222" fill="#bbf7d0" font-size="12" text-anchor="middle">isComplete</text>
  </g>
  <line x1="970" y1="190" x2="998" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="354" fill="#64748b" font-size="13">Pixels stay on the native side. Only recognized strings and their bounding boxes cross the platform channel, about 8 times per second.</text>
</svg>
