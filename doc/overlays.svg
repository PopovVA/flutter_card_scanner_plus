<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="screenA"><rect x="0" y="0" width="270" height="560" rx="34"/></clipPath>
    <clipPath id="screenB"><rect x="0" y="0" width="270" height="560" rx="34"/></clipPath>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#0f172a"/>

  <!-- ===== Phone A: default overlay ===== -->
  <g transform="translate(200 40)">
    <rect x="-12" y="-12" width="294" height="584" rx="44" fill="#27272a"/>
    <g clip-path="url(#screenA)">
      <rect width="270" height="560" fill="url(#scene)"/>
      <!-- card in scene -->
      <g transform="translate(30 190) rotate(-2 105 66)">
        <rect width="210" height="132" rx="12" fill="url(#card)"/>
        <rect x="16" y="30" width="28" height="22" rx="4" fill="#d97706"/>
        <text x="16" y="82" fill="#fff" font-size="15" font-family="'Courier New', monospace" font-weight="700">4242 4242 4242 4242</text>
        <text x="16" y="100" fill="#cbd5e1" font-size="8" font-family="'Courier New', monospace" font-weight="700">12/28</text>
        <text x="16" y="118" fill="#fff" font-size="10" font-family="'Courier New', monospace" font-weight="700">JOHN A SMITH</text>
      </g>
      <!-- scrim with cutout -->
      <path fill-rule="evenodd" d="M0 0h270v560H0z M18 176h234a10 10 0 0 1 10 10v128a10 10 0 0 1-10 10H18a10 10 0 0 1-10-10V186a10 10 0 0 1 10-10z" fill="#000" fill-opacity="0.55"/>
      <!-- brackets -->
      <g fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round">
        <path d="M8 204v-18a10 10 0 0 1 10-10h18"/>
        <path d="M234 176h18a10 10 0 0 1 10 10v18"/>
        <path d="M262 296v18a10 10 0 0 1-10 10h-18"/>
        <path d="M36 324H18a10 10 0 0 1-10-10v-18"/>
      </g>
      <!-- fields -->
      <text x="135" y="360" fill="#fff" font-size="16" text-anchor="middle" font-weight="600" letter-spacing="1">4242 4242 4242 4242</text>
      <text x="135" y="384" fill="#fff" font-size="12" text-anchor="middle">JOHN A SMITH   12/28</text>
      <!-- app bar -->
      <text x="20" y="48" fill="#fff" font-size="20">✕</text>
      <text x="135" y="48" fill="#fff" font-size="16" text-anchor="middle" font-weight="600">Scan card</text>
      <text x="250" y="48" fill="#fff" font-size="16" text-anchor="end">⚡</text>
    </g>
    <rect x="95" y="548" width="80" height="4" rx="2" fill="#a1a1aa"/>
  </g>
  <text x="335" y="638" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="600">CardScannerPage</text>
  <text x="335" y="660" fill="#94a3b8" font-size="13" text-anchor="middle">default overlay, one line of code</text>

  <!-- ===== Phone B: custom overlay ===== -->
  <g transform="translate(730 40)">
    <rect x="-12" y="-12" width="294" height="584" rx="44" fill="#27272a"/>
    <g clip-path="url(#screenB)">
      <rect width="270" height="560" fill="url(#scene)"/>
      <g transform="translate(30 214) rotate(-2 105 66)">
        <rect width="210" height="132" rx="12" fill="url(#card)"/>
        <rect x="16" y="30" width="28" height="22" rx="4" fill="#d97706"/>
        <text x="16" y="82" fill="#fff" font-size="15" font-family="'Courier New', monospace" font-weight="700">5555 5555 5555 4444</text>
        <text x="16" y="100" fill="#cbd5e1" font-size="8" font-family="'Courier New', monospace" font-weight="700">03/27</text>
        <text x="16" y="118" fill="#fff" font-size="10" font-family="'Courier New', monospace" font-weight="700">MARIA GARCIA</text>
      </g>
      <!-- custom: dashed amber frame, no scrim -->
      <rect x="8" y="200" width="254" height="148" rx="10" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
      <!-- live chips -->
      <g transform="translate(16 400)" font-size="11" font-family="'Courier New', monospace">
        <rect width="238" height="26" rx="6" fill="#000" fill-opacity="0.5"/>
        <text x="10" y="17" fill="#94a3b8">PAN</text>
        <text x="60" y="17" fill="#4ade80">5555555555554444</text>
        <rect y="32" width="238" height="26" rx="6" fill="#000" fill-opacity="0.5"/>
        <text x="10" y="49" fill="#94a3b8">EXP</text>
        <text x="60" y="49" fill="#4ade80">03/27</text>
        <rect y="64" width="238" height="26" rx="6" fill="#000" fill-opacity="0.5"/>
        <text x="10" y="81" fill="#94a3b8">NAME</text>
        <text x="60" y="81" fill="#fff">MARIA GARCIA</text>
      </g>
      <rect x="60" y="504" width="150" height="34" rx="17" fill="#6366f1"/>
      <text x="135" y="526" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">Use this card</text>
    </g>
    <rect x="95" y="548" width="80" height="4" rx="2" fill="#a1a1aa"/>
  </g>
  <text x="865" y="638" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="600">CardScannerView + overlayBuilder</text>
  <text x="865" y="660" fill="#94a3b8" font-size="13" text-anchor="middle">your widgets, live per-frame fields</text>
</svg>
