<!doctype html>
<meta charset="utf-8">
<title>worker soak</title>
<body style="font:13px/1.45 monospace; padding:16px">
<pre id="out">starting…</pre>
<script>
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n' + m; };
const file = new URLSearchParams(location.search).get('worker') || 'card_ocr_worker.js';

function draw(width) {
  const height = Math.round(width * 600 / 960);
  const c = new OffscreenCanvas(width, height);
  const g = c.getContext('2d');
  g.setTransform(width / 960, 0, 0, width / 960, 0, 0);
  g.fillStyle = '#1b3a5c'; g.fillRect(0, 0, 960, 600);
  g.fillStyle = '#fff';
  g.font = 'bold 72px "Courier New", monospace';
  g.fillText('4111 1111 1111 1111', 40, 320);
  g.font = 'bold 40px "Courier New", monospace';
  g.fillText('ALICE GREEN', 40, 470);
  g.fillText('12/28', 700, 470);
  g.font = 'bold 44px "Courier New", monospace';
  g.fillText('ZEBRA MONEY', 40, 110);
  return c;
}

(async () => {
  log('worker: ' + file);
  const worker = new Worker('flutter_card_scanner_plus/' + file);
  const answers = new Map();
  let ready;
  const started = new Promise((r) => { ready = r; });
  worker.onmessage = (e) => {
    const d = e.data || {};
    if (d.ready) { ready(); return; }
    answers.get(d.id)?.(d);
    answers.delete(d.id);
  };
  worker.onerror = (e) => log('WORKER ERROR ' + (e.message || e.type));
  await started;

  const canvas = draw(960);
  const times = [];
  for (let i = 0; i < 24; i++) {
    const bitmap = await createImageBitmap(canvas);
    const at = performance.now();
    const answer = new Promise((r) => answers.set(i, r));
    worker.postMessage({ id: i, bitmap }, [bitmap]);
    const reply = await answer;
    const took = Math.round(performance.now() - at);
    if (reply.error) { log('frame ' + i + ' FAILED: ' + reply.error); break; }
    times.push(took);
    if (i === 0 || (i + 1) % 4 === 0) log('frame ' + i + ': ' + took + ' ms, ' + reply.lines.length + ' lines');
  }

  const warm = times.slice(1);
  const mean = (a) => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
  log('');
  log('first frame (loads models): ' + times[0] + ' ms');
  log('warm frames: ' + warm.length + ', mean ' + mean(warm) + ' ms');
  log('  first eight: ' + mean(warm.slice(0, 8)) + ' ms');
  log('  last eight:  ' + mean(warm.slice(-8)) + ' ms');
  log('DONE');
})().catch((e) => log('HARNESS ERROR ' + (e && e.message || e)));
</script>
