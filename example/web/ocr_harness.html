<!doctype html>
<meta charset="utf-8">
<title>worker harness</title>
<body style="font:14px/1.5 monospace; padding:16px">
<pre id="out">starting…</pre>
<canvas id="card" width="960" height="600" style="width:480px;border:1px solid #ccc"></canvas>
<script>
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n' + m; console.log('[harness] ' + m); };

// A synthetic card: the layout a real one has, drawn with a plain font.
function drawCard() {
  const c = document.getElementById('card');
  // ?w= draws the same card smaller, which is what the scanner sends when
  // a card is held further from the lens.
  const width = Number(new URLSearchParams(location.search).get('w') || 960);
  c.width = width;
  c.height = Math.round(width * 600 / 960);
  const g = c.getContext('2d');
  g.setTransform(width / 960, 0, 0, width / 960, 0, 0);
  g.fillStyle = '#1b3a5c'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#ffffff';
  g.font = 'bold 72px "Courier New", monospace';
  g.fillText('4111 1111 1111 1111', 40, 320);
  g.font = 'bold 40px "Courier New", monospace';
  g.fillText('ALICE GREEN', 40, 470);
  g.fillText('12/28', 640, 470);
  g.font = 'bold 44px "Helvetica", sans-serif';
  g.fillText('ZEBRA MONEY', 40, 110);
  return c;
}

(async () => {
  const canvas = drawCard();
  log('card drawn ' + canvas.width + 'x' + canvas.height);

  // ?worker=card_ocr_worker_webgpu.js runs the WebGPU build instead, and
  // &softwareGpu=1 lets it run on a software adapter, which it otherwise
  // refuses: correct there, and most of a minute per frame.
  const parameters = new URLSearchParams(location.search);
  const file = parameters.get('worker') || 'card_ocr_worker.js';
  const suffix = parameters.get('softwareGpu') === '1' ? '?softwareGpu=1' : '';
  log('worker: ' + file);
  const worker = new Worker('flutter_card_scanner_plus/' + file + suffix);
  const started = performance.now();

  worker.onerror = (e) => log('WORKER ERROR ' + (e.message || e.type));

  // Replies to a frame are matched by id. The three other things a worker
  // says, that it started, how fast WebAssembly is and whether the engine
  // loaded, each have one waiter at a time.
  const answers = new Map();
  const once = (key) => new Promise((r) => answers.set(key, r));
  const ready = once('ready');
  worker.onmessage = (e) => {
    const d = e.data || {};
    const key = d.ready ? 'ready'
      : 'benchmarkMs' in d ? 'benchmark'
      : (d.loaded || d.loadError) ? 'load'
      : d.id;
    const settle = answers.get(key);
    if (settle) { answers.delete(key); settle(d); }
  };

  const hello = await ready;
  log('worker ready in ' + Math.round(performance.now() - started) + ' ms, backend ' + hello.backend);

  // The same three steps the scanner takes: time WebAssembly, load the
  // engine, time it again, and only then send a frame.
  const benchmark = async (when) => {
    const waiting = once('benchmark');
    worker.postMessage({ benchmark: true });
    const reply = await waiting;
    log('benchmark ' + when + ': ' + (reply.benchmarkMs == null
      ? 'FAILED ' + reply.benchmarkError
      : reply.benchmarkMs.toFixed(1) + ' ms'));
  };

  await benchmark('before the load');
  const loadStarted = performance.now();
  const loading = once('load');
  worker.postMessage({ load: true });
  const loaded = await loading;
  const loadTook = Math.round(performance.now() - loadStarted);
  if (loaded.loadError) {
    log('LOAD FAILED after ' + loadTook + ' ms: ' + loaded.loadError);
    log('DONE');
    return;
  }
  log('engine loaded in ' + loadTook + ' ms, backend ' + loaded.backend);
  await benchmark('after the load');

  const recognize = async (id) => {
    const bitmap = await createImageBitmap(canvas);
    const answer = once(id);
    worker.postMessage({ id, bitmap }, [bitmap]);
    return answer;
  };

  for (let i = 0; i < 2; i++) {
    const at = performance.now();
    const reply = await recognize(i);
    const took = Math.round(performance.now() - at);
    if (reply.error) { log('frame ' + i + ' FAILED after ' + took + ' ms: ' + reply.error); break; }
    log('frame ' + i + ' in ' + took + ' ms, ' + reply.lines.length + ' lines');
    for (const line of reply.lines) {
      log('   "' + line.text + '" c=' + line.confidence.toFixed(2) +
          ' box=' + ['left','top','width','height'].map(k => line.box[k].toFixed(3)).join(','));
    }
  }
  log('DONE');
})().catch((e) => log('HARNESS ERROR ' + (e && e.message || e)));
</script>
